        function doAction(actionScript) {
            var ip = document.getElementById("misty-robot-ip-address").value
            var skill_id = document.getElementById("misty-skill-id").value
            var event_name = document.getElementById("misty-event-name").value

            var  data = {
                "Skill":skill_id,
                "EventName": event_name,
                "Payload": actionScript
            };
            console.log(data);
            Promise.race([
                // fetch('http://' + ip + '/api/skills/event', {
                fetch("http://127.0.0.1:5000/behavior_generator", {
                    method: 'POST',
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data),
                    dataType: "json"
                }),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000))
            ])
            .then(response => response.json())
            .then(jsonData => console.log(jsonData)); 
        }
